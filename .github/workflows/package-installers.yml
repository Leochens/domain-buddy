name: Package installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Windows x64 NSIS
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Normalize artifact name and checksum
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle/nsis"
          $source = Get-ChildItem -Path $bundleDir -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $source) {
            throw "NSIS installer was not generated"
          }
          $version = (Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $destination = Join-Path $bundleDir "Domain-Buddy_${version}_x64-setup.exe"
          Move-Item -Path $source.FullName -Destination $destination
          $hash = (Get-FileHash -Algorithm SHA256 -Path $destination).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($destination))" |
            Set-Content -Path (Join-Path $bundleDir "SHA256SUMS-windows.txt") -Encoding ascii

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: domain-buddy-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/Domain-Buddy_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS-windows.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
