[package]
name = "domain-buddy"
version = "0.1.0"
description = "Local multi-provider DNS management desktop app"
authors = ["Leochens"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Leochens/domain-buddy"
homepage = "https://github.com/Leochens/domain-buddy"
keywords = ["tauri", "dns", "dnspod", "cloudflare", "volcengine"]
categories = ["network-programming"]
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "domain_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
keyring = "4.1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
hmac = "0.12"
base64 = "0.22.1"
percent-encoding = "2.3.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha1 = "0.10.6"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
